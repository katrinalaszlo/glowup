<svg xmlns="http://www.w3.org/2000/svg" width="1180" height="868" viewBox="0 0 1180 868" role="img" aria-labelledby="title desc" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace">
  <title id="title">glowup — a design skill for the terminal</title>
  <desc id="desc">Real before/after: context-receipt's plain printf (2026-07-17) next to debloat's real colored, bar-charted, box-summarized output (2026-07-24). Both panels are genuine terminal captures.</desc>
  <rect width="1180" height="868" fill="#0a0e14"/>

  <!-- header -->
  <text x="40" y="62" font-family="ui-sans-serif, -apple-system, 'Helvetica Neue', Arial, sans-serif" font-size="34" font-weight="800" fill="#f2f5f8">glowup</text>
  <text x="185" y="62" font-size="17" fill="#8b95a1">a design skill for the terminal</text>
  <text x="1140" y="58" text-anchor="end" font-size="15" fill="#6e7681">github.com/katrinalaszlo/glowup</text>

  <!-- before/after labels -->
  <text x="298" y="118" text-anchor="middle" font-size="13" letter-spacing="1.5" fill="#8b95a1">BEFORE — PLAIN PRINTF</text>
  <text x="844" y="118" text-anchor="middle" font-size="13" letter-spacing="1.5" fill="#39c5cf" font-weight="700">AFTER — REAL DEBLOAT OUTPUT, 2026-07-24</text>

  <!-- real captures, unmodified from assets/before-after.svg -->
  <g transform="translate(40,138)" font-size="12">
    <!-- BEFORE panel: context-receipt, 2026-07-17, plain printf -->
    <g>
      <rect x="8" y="8" width="500" height="398" rx="8" fill="#161b22" stroke="#30363d"/>
      <circle cx="30" cy="28" r="5.5" fill="#ff5f57"/>
      <circle cx="48" cy="28" r="5.5" fill="#febc2e"/>
      <circle cx="66" cy="28" r="5.5" fill="#28c840"/>
      <text x="258" y="32" text-anchor="middle" fill="#6e7681" font-size="11">before — context-receipt, 2026-07-17</text>
      <g fill="#c9d1d9">
        <text x="22" y="62">CONTEXT RECEIPT</text>
        <text x="22" y="81">claude code · vault</text>
        <text x="22" y="100">2026-07-17 18:23</text>
        <line x1="22" y1="115" x2="486" y2="115" stroke="#c9d1d9" stroke-width="1"/>
        <text x="22" y="138">LOADED BEFORE YOUR PROMPT</text>
        <text x="486" y="138" text-anchor="end">tokens*</text>
        <text x="22" y="157">claude code system prompt</text>
        <text x="486" y="157" text-anchor="end">~6.8k</text>
        <text x="22" y="176">CLAUDE.md (global)</text>
        <text x="486" y="176" text-anchor="end">1.5k</text>
        <text x="22" y="195">MEMORY.md (auto-memory index)</text>
        <text x="486" y="195" text-anchor="end">3.7k</text>
        <text x="22" y="214">skill listing, user (20 skills)</text>
        <text x="486" y="214" text-anchor="end">1.8k</text>
        <line x1="22" y1="229" x2="486" y2="229" stroke="#c9d1d9" stroke-width="1"/>
        <text x="22" y="252">TOTAL</text>
        <text x="486" y="252" text-anchor="end">~24.8k</text>
        <text x="22" y="290">DEAD WEIGHT — on disk, NOT loaded</text>
        <text x="36" y="309">AGENTS.md</text>
        <text x="486" y="309" text-anchor="end">17.8k chars</text>
        <text x="50" y="328" font-size="11">not read by Claude Code unless @imported from CLAUDE.md</text>
        <text x="22" y="347">* chars÷4 estimate · reconcile with /context</text>
        <text x="22" y="366">npx context-receipt</text>
      </g>
    </g>

    <!-- AFTER panel: debloat, 2026-07-24, real npx debloat output -->
    <g>
      <rect x="524" y="8" width="560" height="560" rx="8" fill="#161b22" stroke="#30363d"/>
      <circle cx="546" cy="28" r="5.5" fill="#ff5f57"/>
      <circle cx="564" cy="28" r="5.5" fill="#febc2e"/>
      <circle cx="582" cy="28" r="5.5" fill="#28c840"/>
      <text x="804" y="32" text-anchor="middle" fill="#6e7681" font-size="11">after — debloat, 2026-07-24, real output</text>

      <text x="540.0" y="60" fill="#f85149" font-weight="700" textLength="319.2" lengthAdjust="spacingAndGlyphs">⚡ 19.9k tokens loaded every session before</text>
      <text x="540.0" y="79" fill="#f85149" font-weight="700" textLength="114.0" lengthAdjust="spacingAndGlyphs">your first word</text>
      <text x="540.0" y="98" fill="#6e7681" textLength="304.0" lengthAdjust="spacingAndGlyphs">claude code · debloat · 2026-07-24 14:22</text>

      <text x="540.0" y="128.4" fill="#c9d1d9" textLength="121.6" lengthAdjust="spacingAndGlyphs">claude code base</text>
      <text x="676.8" y="128.4" fill="#6e7681" textLength="106.4" lengthAdjust="spacingAndGlyphs">██████████████</text>
      <text x="1068.0" y="128.4" text-anchor="end" fill="#c9d1d9" textLength="45.6" lengthAdjust="spacingAndGlyphs">~10.9k</text>
      <text x="540.0" y="147.4" fill="#c9d1d9" textLength="91.2" lengthAdjust="spacingAndGlyphs">instructions</text>
      <text x="676.8" y="147.4" fill="#c9d1d9" textLength="30.4" lengthAdjust="spacingAndGlyphs">████</text>
      <text x="1068.0" y="147.4" text-anchor="end" fill="#c9d1d9" textLength="30.4" lengthAdjust="spacingAndGlyphs">3.3k</text>
      <text x="540.0" y="166.4" fill="#c9d1d9" textLength="45.6" lengthAdjust="spacingAndGlyphs">memory</text>
      <text x="1068.0" y="166.4" text-anchor="end" fill="#c9d1d9" textLength="7.6" lengthAdjust="spacingAndGlyphs">0</text>
      <text x="540.0" y="185.4" fill="#c9d1d9" textLength="114.0" lengthAdjust="spacingAndGlyphs">skills + agents</text>
      <text x="676.8" y="185.4" fill="#f85149" textLength="53.2" lengthAdjust="spacingAndGlyphs">███████</text>
      <text x="1068.0" y="185.4" text-anchor="end" fill="#c9d1d9" textLength="30.4" lengthAdjust="spacingAndGlyphs">5.7k</text>

      <text x="540.0" y="215.8" fill="#d29922" textLength="250.8" lengthAdjust="spacingAndGlyphs">DEAD WEIGHT — on disk, NOT loaded</text>
      <text x="555.2" y="234.8" fill="#c9d1d9" textLength="159.6" lengthAdjust="spacingAndGlyphs">../../../../AGENTS.md</text>
      <text x="1068.0" y="234.8" text-anchor="end" fill="#c9d1d9" textLength="76.0" lengthAdjust="spacingAndGlyphs">5.3k chars</text>
      <text x="570.4" y="253.8" fill="#6e7681" font-size="11" textLength="296.4" lengthAdjust="spacingAndGlyphs">ignored unless @imported from CLAUDE.md</text>

      <text x="540.0" y="284.2" fill="#c9d1d9" textLength="266.0" lengthAdjust="spacingAndGlyphs">MCP, loads on use: supabase, gbrain</text>

      <text x="540.0" y="318.4" fill="#6e7681" textLength="311.6" lengthAdjust="spacingAndGlyphs">┌───────────────────────────────────────┐</text>
      <text x="540.0" y="337.4" fill="#6e7681">│</text>
      <text x="844.0" y="337.4" fill="#6e7681">│</text>
      <text x="540.0" y="356.4" fill="#6e7681">│</text>
      <text x="586.4" y="356.4" fill="#e6edf3" font-weight="700" textLength="98.8" lengthAdjust="spacingAndGlyphs">~19.9k tokens</text>
      <text x="702.2" y="356.4" fill="#6e7681" font-size="11" textLength="167.2" lengthAdjust="spacingAndGlyphs">· 10% of a 200k window</text>
      <text x="844.0" y="356.4" fill="#6e7681">│</text>
      <text x="540.0" y="375.4" fill="#6e7681">│</text>
      <text x="844.0" y="375.4" fill="#6e7681">│</text>
      <text x="540.0" y="394.4" fill="#6e7681">│</text>
      <text x="585.6" y="394.4" fill="#f85149" font-weight="700" textLength="220.4" lengthAdjust="spacingAndGlyphs">~5.3k of it is skill listings</text>
      <text x="844.0" y="394.4" fill="#6e7681">│</text>
      <text x="540.0" y="413.4" fill="#6e7681">│</text>
      <text x="585.6" y="413.4" fill="#c9d1d9" textLength="136.8" lengthAdjust="spacingAndGlyphs">trim the unused: </text>
      <text x="722.4" y="413.4" fill="#39c5cf" textLength="83.6" lengthAdjust="spacingAndGlyphs">npx debloat</text>
      <text x="844.0" y="413.4" fill="#6e7681">│</text>
      <text x="540.0" y="432.4" fill="#6e7681">│</text>
      <text x="844.0" y="432.4" fill="#6e7681">│</text>
      <text x="540.0" y="451.4" fill="#6e7681" textLength="311.6" lengthAdjust="spacingAndGlyphs">└───────────────────────────────────────┘</text>

      <text x="540.0" y="481.8" fill="#6e7681" font-size="11" textLength="342.0" lengthAdjust="spacingAndGlyphs">note: no auto-mem…found for this project path</text>
      <text x="540.0" y="500.8" fill="#6e7681" font-size="11" textLength="334.4" lengthAdjust="spacingAndGlyphs">* chars÷4 estimate · reconcile with /context</text>
    </g>
  </g>

  <!-- footer install command -->
  <rect x="316" y="800" width="548" height="48" rx="8" fill="#11161d" stroke="#30363d"/>
  <text x="342" y="830" font-size="16" fill="#6e7681">$</text>
  <text x="362" y="830" font-size="16" fill="#d7dde3">npx skills add katrinalaszlo/glowup -g</text>
</svg>
